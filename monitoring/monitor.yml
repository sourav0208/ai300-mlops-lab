$schema: http://azureml/sdk-2-0/Schedule.json

name: diabetes-model-monitoring
display_name: Diabetes model monitoring
description: Monitor green diabetes deployment

trigger:
  type: recurrence
  frequency: day
  interval: 1
  schedule:
    hours: 3
    minutes: 15

create_monitor:
  compute:
    instance_type: standard_e4s_v3
    runtime_version: "3.4"

  monitoring_target:
    ml_task: classification
    endpoint_deployment_id: azureml:diabetes-sourav-endpoint:green