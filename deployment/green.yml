$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

name: green #changed development name
endpoint_name: diabetes-sourav-endpoint

model: azureml:diabetes-classification-model:2 #changed model version

code_configuration:
  code: ./code
  scoring_script: score.py

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: conda.yml

data_collector:
  collections:
    model_inputs:
      enabled: 'True'
    model_outputs:
      enabled: 'True'

environment_variables:
  DEPLOYMENT_NAME: green

instance_type: Standard_D2ads_v5
instance_count: 1