$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

name: blue
endpoint_name: diabetes-sourav-endpoint

model: azureml:diabetes-classification-model:1

code_configuration:
  code: ./code
  scoring_script: score.py

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: conda.yml

data_collector:
  collections:
    request:
      enabled: 'True'
    response:
      enabled: 'True'

environment_variables:
  DEPLOYMENT_NAME: blue

instance_type: Standard_D2a_v4 #what size VM should serve predictions
instance_count: 1 # how many of those VM should run. More VM to handle more traffic